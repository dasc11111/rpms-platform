name: Claude Labels Fix
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch'
        required: true
        type: string
        default: 'feature/fase23-petct-fase-a-arquitectura'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Fix LABELS indexing
        run: |
          cat > /tmp/fix_labels.py << 'PYEOF'
          import re, os, sys
          pat = re.compile(r'(\b\w+_LABELS)\[(?!String\()([^\]]+)\]')
          for root, dirs, files in os.walk('frontend/web/src/app/api'):
              for f in files:
                  if not f.endswith('.ts'): continue
                  path = os.path.join(root, f)
                  txt = open(path).read()
                  new = pat.sub(r'\1[String(\2)]', txt)
                  if new != txt:
                      open(path, 'w').write(new)
                      print('Fixed:', path, file=sys.stderr)
          PYEOF
          python3 /tmp/fix_labels.py
          echo "Files changed:"; git diff --name-only
      - name: Commit and push
        run: |
          git config user.name "Claude Sonnet 4.6"
          git config user.email "noreply@anthropic.com"
          git add -A
          CHANGED=$(git diff --cached --name-only | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            printf 'fix(ts): wrap all LABELS index accesses with String()\n\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_019WtbdcPyBonjC3rCiF3wqd\n' > /tmp/msg.txt
            git commit -F /tmp/msg.txt
            git push origin ${{ inputs.branch }}
            echo "Pushed $CHANGED files"
          else
            echo "No changes to commit - files may already be fixed"
          fi
